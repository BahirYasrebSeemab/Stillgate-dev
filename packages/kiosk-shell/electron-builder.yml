# Builds the kiosk shell for the visitor PCs: bun run dist (run ON WINDOWS).
# The install script copies the unpacked app to C:\Program Files\Stillgate\kiosk-shell
# and the agent sets it as the kiosk user's Windows shell.
# UNTESTED(windows): packaging with Bun's isolated node_modules layout (see manager's yml).
appId: local.stillgate.kiosk
productName: Stillgate Kiosk
executableName: kiosk-shell
directories:
  output: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/common/**
  - dist/renderer/**
  - package.json
asar: true
win:
  target: dir
# Security: permanently switch off Electron features an attacker could use on the PC
# (run the app as plain Node.js, NODE_OPTIONS, --inspect debugging, loading code outside app.asar)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
