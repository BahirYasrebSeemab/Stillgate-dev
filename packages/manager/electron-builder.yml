# Builds the Windows installer for the manager PC: bun run dist (run ON WINDOWS).
# UNTESTED(windows): packaging with Bun's isolated node_modules layout. If electron-builder
# cannot find dependencies, add to the repo's bunfig.toml:  [install] linker = "hoisted"
appId: local.asd.lablock.manager
productName: ASD Lab Manager
artifactName: ASD-Lab-Manager-Setup-${version}.${ext}
directories:
  output: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/common/**
  - dist/renderer/**
  - assets/**
  - package.json
asar: true
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
# Security: permanently switch off Electron features an attacker could use on the PC
# (run the app as plain Node.js, NODE_OPTIONS, --inspect debugging, loading code outside app.asar)
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableCookieEncryption: true
